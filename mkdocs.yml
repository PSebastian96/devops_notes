  - SQL:
    - Overview: sql/index.md
    - ERD: 
      - Concept: sql/erd.md
      - Relationships: sql/relations.md
      - Index,Constraint & Transactions: sql/ind_con_tra.md
    - SQL:
      - Syntax: sql/syntax.md
      - Functions: sql/functions.md

markdown_extensions:
  # Admonitions
  - admonition

  # Markdown inside HTML - REQUIRED for Material grids/cards
  - md_in_html
  - pymdownx.details
  
  # Content tabs
  - pymdownx.tabbed:
      alternate_style: true

  # Code blocks and Mermaid diagrams
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

  # Better syntax highlighting
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  
  # Icons and emojis
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  
  # Inline code
  - pymdownx.inlinehilite

  # Attribute lists
  - attr_list

  # Tables
  - tables