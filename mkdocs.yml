site_name: DevOps Notes

theme:
  name: material

  features:
    # Navigation
    - navigation.sections
    - navigation.top

    # Search
    - search.suggest
    - search.highlight

    # Code blocks
    - content.code.copy

  # Site appearance
  palette:
    # Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: green
      accent: light green
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

    # Light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: green
      accent: light green
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode

plugins:
  - search

nav:
  - Menu: index.md

  - Python:
